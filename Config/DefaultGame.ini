[/Script/SouthernSpearLyraBridge.SSHandIKMeshComponent]
; The hold, as per-weapon data (Session 073). PalmTiltDeg is how far the left palm's normal leans off the
; weapon's own up, towards the weapon's right: 0 is the palm flat under the handguard, 90 is a vertical
; grip with the palm facing across the tube. The A88 is the only one measured so far - its mesh was
; checked for a vertical grip and has none (nothing below the bore line beyond 9.1 cm ahead of the
; trigger, where the handguard runs to the front sight), so it takes the plain-handguard 30 deg. The rest
; fall back on DefaultPalmTiltDeg, which is that same plain hand under a handguard, until someone
; measures their mesh the same way: a hold guessed from a weapon's real-world type is exactly the
; borrowed pose this replaced. The frame itself is built at run time from the Muzzle, RightHandGrip and
; component-up vectors, because only socket POSITIONS survive the FBX round trip.
;
; The map's ini form is ((Key,Value)) and it is not forgiving: (A88=30.0) imports as a FAILURE, which
; LogObj reports and the engine then swallows - the property stays empty and every weapon silently takes
; DefaultPalmTiltDeg, with no other symptom. Verified by setting the A88 to 45 and reading the realised
; tilt back at 45.0 deg; when a per-weapon row appears to be ignored, check the log for "import failed
; for GripPalmTiltDeg" before suspecting the code.
DefaultPalmTiltDeg=30.0
+GripPalmTiltDeg=(("A88",30.0))

; GripNudgeCm moves the left WRIST off its grip socket, in centimetres, along the hold's own axes:
; Forward along the bore, Right towards the shooter's right, Up along the weapon's up. The socket is
; the ADFRC handAnim wrist and has never been authored (R-86): on the A88 it leaves the wrist 10.3 cm
; off the bore, where a hand round a handguard belongs about 4-5 cm out - the tube's radius plus the
; palm's depth. The A88's row takes it to 4.6 cm, and the Forward figure is the interesting one: it
; is NEGATIVE, so the hand also comes 4.7 cm BACK along the bore. That is not a fudge, it is reach.
; The first-person shoulder's own bone sits 44.4 cm to the left of the bore and the whole arm is
; 51.8 cm, so a wrist at the socket is already 48.7 cm out - 3.1 cm from straight. Every centimetre
; the wrist moves in towards the tube is a centimetre of arm spent, and it has to be paid back
; somewhere: back along the tube is the only somewhere that keeps the hand on the handguard.
; At this row the arm has 1.2 cm of elbow left and the wrist lands 17.2 cm along the tube.
; As with GripPalmTiltDeg the map literal is ((Key,Struct)) and a malformed one is an import failure
; the engine logs and then swallows; unlisted weapons take DefaultGripNudge, which is no nudge.
DefaultGripNudge=(Forward=0.0,Right=0.0,Up=0.0)
+GripNudgeCm=(("A88",(Forward=-4.7,Right=5.4,Up=2.1)))

; The first-person arms' left hand, turned to that hold (W2, Session 071/072). The Fab arms come with no
; grip animation, so the wrist solve alone left the palm open on the receiver. The angle is solved from
; the arms' own anatomy read off its finger bones (palm normal, finger direction, thumb), never from the
; other rig's hand-bone quaternion: Manny's hand_l and the arms' LeftHand do not share an axis
; convention, and copying a hand rotation across carries that mismatch - it measured 83 deg of roll on
; that pair, while the arms' animated thumb was already 11.5 deg off the bore against the body's 11.3.
; So the arms' measured frame is aligned onto the hold built from the weapon's sockets:
; offset = holdrot^-1 * (align * hand). Solved on the A88 from its own clip pose with -SSHandIKProbe
; -SSHandIKProbeNoRotate, and it holds across every sample of the run and in the live pose afterwards:
; the arms' finger-bone frame then matches the hold on all three axes to 0.0 deg, once the IK has
; finished fading in (BlendSpeed 8/s, so by t=1.5 s; the first three samples read 55/20 deg on the way
; there, which is the blend, not an error). Docs/evidence/handik_hold/. The Manny body keeps the default
; (bRotateHandToGrip is off for it), so this value only ever applies to SK_FP_Arms_Rifle's skeleton.
HandRotationOffset=(Pitch=33.853,Yaw=136.820,Roll=-89.996)

