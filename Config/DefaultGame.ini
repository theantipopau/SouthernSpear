; The first-person arms' left hand, turned to the weapon's LeftHandGrip socket (W2, Session 070). The Fab
; arms come with no grip animation, so the wrist solve alone left the palm open on the receiver. This
; correction is the one that makes their hand hold the weapon exactly the way the third-person body's own
; Lyra animation already holds it, measured in the weapon's frame (solver: Tools/Unreal/grip_solve.py on
; Saved/Logs/SS_grip_a88.log; evidence in Docs/evidence/handik_rot/ and Docs/evidence/handik_pos/). The
; Manny body keeps the default (bRotateHandToGrip is off for it), so this value only ever applies to
; SK_FP_Arms_Rifle's skeleton.
HandRotationOffset=(Pitch=25.810,Yaw=146.002,Roll=-40.132)
