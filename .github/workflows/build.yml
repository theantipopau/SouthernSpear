# ============================================================================
# Southern Spear - CI
#
# Self-hosted Windows runner: the Unreal Engine 5.8.3 install and the Visual
# Studio toolchain live on the development machine, not on GitHub-hosted
# runners. See Docs/PROJECT_AUDIT.md.
# ============================================================================
name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Adjust if the engine lives elsewhere. Defaults to the audited path.
  # NOTE: single-quoted - backslashes in double-quoted YAML are escape sequences.
  UE_ROOT: 'E:\Unreal\UE_5.8'
  PROJECT_DIR: 'E:\SouthernSpear'
  PROJECT_NAME: "SouthernSpear"
  # Engine minimum, read from VCToolChain.cs - see PROJECT_AUDIT.md
  MSVC_MIN_VERSION: "14.44.34918"

jobs:
  verify:
    name: Verify, build and test
    # The engine and MSVC toolchain are installed on this machine only.
    runs-on: [ self-hosted, windows, ue-5.8 ]
    timeout-minutes: 90

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Report toolchain
        shell: cmd
        run: |
          echo === Engine ===
          type "%UE_ROOT%\Engine\Build\Build.version"
          echo === MSVC ===
          dir /b "%ProgramFiles%\Microsoft Visual Studio\2022\Community\VC\Tools\MSVC"
          echo === UBT ===
          "%UE_ROOT%\Engine\Build\BatchFiles\Build.bat" -Mode=QueryTargets

      # Risk R-04: the installed MSVC clears the engine minimum by a very thin
      # margin. If UBT ever reports a compiler error, a silently downgraded
      # toolset is the first thing to check.
      - name: Assert MSVC meets the engine minimum
        shell: pwsh
        run: |
          $min = [version]($env:MSVC_MIN_VERSION)
          $root = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Community\VC\Tools\MSVC"
          $installed = Get-ChildItem $root -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $cur = [version](($installed.Name -replace '\.(\d+)$', '.$1'))
          Write-Host "Installed MSVC: $cur ; Required: $min"
          if ($cur -lt $min) { throw "MSVC $cur is below the engine minimum $min" }

      - name: Verify Git LFS integrity
        shell: cmd
        run: git lfs fsck && git lfs ls-files

      # TDD 3.3 - the presentation resolver must be structurally incapable of
      # touching gameplay. Enforced in CI rather than by code review.
      - name: Static scan - presentation must not reference gameplay
        shell: pwsh
        run: |
          $violations = @()
          $files = Get-ChildItem -Path .\Source,.\Plugins -Recurse -Filter *.h -EA SilentlyContinue |
                   Where-Object { $_.FullName -match 'Presentation' }
          foreach ($f in $files) {
            if ($f.FullName -match 'Test') { continue }   # whitelisted
            $bad = Select-String -Path $f.FullName -Pattern 'Weapon|Damage|AbilitySystem|Health'
            if ($bad) { $violations += "$($f.FullName): $($bad -join '; ')" }
          }
          if ($violations) { $violations | ForEach-Object { Write-Host "VIOLATION: $_" }; throw "Presentation referenced gameplay headers" }
          Write-Host "PASS: presentation layer is decoupled from gameplay"

      # TDD 3.2 / TEST_PLAN 4.1 - the progression curve must be data-driven.
      - name: Static scan - no progression numbers in C++
        shell: pwsh
        run: |
          $bad = Select-String -Path .\Source\SouthernSpearProgression\*.cpp,.\Source\SouthernSpearProgression\*.h `
                 -Pattern 'RankThreshold\s*=\s*\d|XpPerRank\s*=\s*\d|AccountLevelThreshold\s*=\s*\d' -EA SilentlyContinue
          if ($bad) { $bad | ForEach-Object { Write-Host "VIOLATION: $_" }; throw "Progression numbers found in C++" }
          Write-Host "PASS: progression is data-driven"

      # Legal gate: nothing third-party ships without a licence record.
      - name: Static scan - no secrets in repository
        shell: cmd
        run: |
          git grep -n -I -E "(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|api[_-]?key\s*=\s*[A-Za-z0-9]{16,}|client[_-]?secret\s*=\s*[A-Za-z0-9]{16,})" -- . ':!Docs' ':!.github'
          if %errorlevel% equ 0 (exit /b 1) else (echo PASS: no secrets found)

      # The Dry River blockout must not drift from its design spec. Layout is
      # gameplay-load-bearing, so a silent geometry change is a balance change.
      - name: Verify Dry River blockout against its design spec
        shell: cmd
        run: python Tools\Blender\verify_dryriver.py

      # Dressing is a pure data edit, so it gets a pure data check. This runs in
      # seconds with no Blender and no editor, which is the point: a fence dragged
      # through an objective must not cost a six minute editor start to discover.
      - name: Verify Dry River dressing data
        shell: cmd
        run: python Tools\verify_dressing.py

      # ADR-004 and ADR-017 are only worth anything if they are enforced rather
      # than remembered. This guard fails the build if SouthernSpearCore gains a
      # sibling-plugin or Lyra dependency, if a presentation header reaches
      # gameplay types, or if Friendly/Opposing reappear as authoritative team
      # values. Runs in a second with no editor, so the boundary is cheaper to
      # keep than to break.
      - name: Verify architecture boundaries
        shell: cmd
        run: python Tools\validate_architecture.py

      - name: Upload architecture guard report
        if: always()
        shell: cmd
        run: python Tools\validate_architecture.py --json > "%PROJECT_DIR%\Build\architecture_report.json"

      - name: Build Editor
        shell: cmd
        run: |
          "%UE_ROOT%\Engine\Build\BatchFiles\Build.bat" %PROJECT_NAME%Editor Win64 Development ^
              -Project="%PROJECT_DIR%\%PROJECT_NAME%.uproject" -WaitMutex

      # The map is built by two headless editor passes, not by hand, so it is
      # verified like any other build output. Pass 1 constructs and saves the
      # level; pass 2 loads it (which is what registers the nav bounds volume),
      # runs the editor's blocking Build Paths, and asserts a traversable path
      # exists between the two deployments.
      #
      # The -ini override releases ENavigationBuildLock::AsyncLoadLock, which
      # otherwise refuses every build in a one-shot script. It is applied here
      # rather than in DefaultEngine.ini so the editor default is untouched.
      # See Docs/MAPS_DRYRIVER.md section 11.
      - name: Build Dry River level (construct)
        shell: cmd
        run: |
          "%UE_ROOT%\Engine\Binaries\Win64\UnrealEditor-Cmd.exe" ^
              "%PROJECT_DIR%\%PROJECT_NAME%.uproject" ^
              -nullrhi -unattended -nosplash -nosound -stdout ^
              -ini:Engine:[/Script/NavigationSystem.NavigationSystemV1]:bWaitForAsyncLoadingBeforeBuildingNavigationAutomatically=False ^
              -ExecutePythonScript="%PROJECT_DIR%\Tools\Unreal\build_dryriver_level.py"

      # Dressing runs BEFORE navigation, or the fences and wrecks are invisible
      # to the NavMesh and agents walk through them.
      - name: Dress Dry River from placement data
        shell: cmd
        run: |
          "%UE_ROOT%\Engine\Binaries\Win64\UnrealEditor-Cmd.exe" ^
              "%PROJECT_DIR%\%PROJECT_NAME%.uproject" ^
              -nullrhi -unattended -nosplash -nosound -stdout ^
              -ini:Engine:[/Script/NavigationSystem.NavigationSystemV1]:bWaitForAsyncLoadingBeforeBuildingNavigationAutomatically=False ^
              -ExecutePythonScript="%PROJECT_DIR%\Tools\Unreal\dress_dryriver.py"

      - name: Build Dry River NavMesh and verify path
        shell: cmd
        run: |
          "%UE_ROOT%\Engine\Binaries\Win64\UnrealEditor-Cmd.exe" ^
              "%PROJECT_DIR%\%PROJECT_NAME%.uproject" ^
              -nullrhi -unattended -nosplash -nosound -stdout ^
              -ini:Engine:[/Script/NavigationSystem.NavigationSystemV1]:bWaitForAsyncLoadingBeforeBuildingNavigationAutomatically=False ^
              -ExecutePythonScript="%PROJECT_DIR%\Tools\Unreal\build_dryriver_nav.py"

      - name: Assert Dry River gate G1.1 result
        shell: cmd
        run: |
          if not exist "%PROJECT_DIR%\Build\dryriver_nav_report.json" (
            echo FAIL: no navigation report was produced
            exit /b 1
          )
          python -c "import json,sys; r=json.load(open(r'%PROJECT_DIR%\Build\dryriver_nav_report.json')); \
          steps={s['step']:s['ok'] for s in r['steps']}; \
          print('G1.1 path points:', r.get('path_points')); \
          print('G1.1 ok:', r.get('ok')); \
          sys.exit(0 if r.get('ok') and steps.get('path_verification') and r.get('path_points',0)>1 else 1)"

      - name: Upload Dry River gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dryriver-gate-evidence
          path: |
            %PROJECT_DIR%\Build\dryriver_level_report.json
            %PROJECT_DIR%\Build\dryriver_dressing_report.json
            %PROJECT_DIR%\Build\dryriver_nav_report.json

      # D-05: the dedicated server is a first-class target, not a later step.
      # BLOCKED: this engine distribution is game/editor-only and refuses
      # TargetType.Server outright (its [InstalledPlatforms] whitelist holds
      # only Editor and Game). This step will fail until a server-capable
      # engine is installed. See Docs/PROJECT_AUDIT.md section 6.1 and R-09.
      - name: Build Dedicated Server
        shell: cmd
        continue-on-error: true
        run: |
          "%UE_ROOT%\Engine\Build\BatchFiles\Build.bat" %PROJECT_NAME%Server Win64 Development ^
              -Project="%PROJECT_DIR%\%PROJECT_NAME%.uproject" -WaitMutex

      - name: Run automation tests
        shell: cmd
        run: |
          "%UE_ROOT%\Engine\Binaries\Win64\UnrealEditor-Cmd.exe" ^
              "%PROJECT_DIR%\%PROJECT_NAME%.uproject" ^
              -ExecCmds="Automation RunTests SouthernSpear.Unit+SouthernSpear.Integration+SouthernSpear.Network+SouthernSpear.Leak;Quit" ^
              -unattended -nopause -nosplash -nullrhi -log -ReportOutputPath="%PROJECT_DIR%\Saved\TestResults"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '${{ env.PROJECT_DIR }}\Saved\TestResults'
          if-no-files-found: ignore
